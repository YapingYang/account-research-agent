[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "account-research-agent"
version = "0.1.0"
description = "A sourced account research agent scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "deepagents", "langchain", "langgraph", "langchain-groq", "langchain-mcp-adapters",
  "tavily-python", "pydantic", "pydantic-settings", "pyyaml", "typer", "rich", "python-dotenv"
]

[project.optional-dependencies]
edgar = ["sec-edgar-mcp"]
local = ["langchain-ollama"]
gemini = ["langchain-google-genai"]

[dependency-groups]
dev = ["pytest", "pytest-mock", "ruff", "mypy", "pre-commit", "types-PyYAML"]

[project.scripts]
ara = "account_research.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/account_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["account_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

